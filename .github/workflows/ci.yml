name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # Light install: the offline tests need no DfT data, Prophet or statsmodels.
    # The LSTM test is skipped when torch is absent.
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install pandas numpy scikit-learn xgboost imbalanced-learn joblib pytest

    - name: Run tests
      run: pytest -v
